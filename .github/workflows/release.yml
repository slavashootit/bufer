name: Release

# Push a tag like v0.3.0 to build Bufer on a GitHub Mac and publish a release with the DMG.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then VERSION=""; fi
          scripts/package.sh "$VERSION"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Bufer
          path: |
            dist/Bufer.dmg
            dist/Bufer.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Bufer.dmg dist/Bufer.zip \
            --title "Bufer $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
