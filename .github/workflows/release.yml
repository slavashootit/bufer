name: Release

# Builds Bufer on a GitHub Mac and publishes a release with Bufer.dmg.
# Start it from Actions → Release → Run workflow (version comes from Info.plist),
# or push a tag like v0.4.0.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build universal app
        run: scripts/package.sh "${{ steps.version.outputs.version }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Bufer
          path: |
            dist/Bufer.dmg
            dist/Bufer.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/Bufer.dmg dist/Bufer.zip \
            --target "$GITHUB_SHA" \
            --title "Bufer $VERSION" \
            --notes-file RELEASE_NOTES.md
